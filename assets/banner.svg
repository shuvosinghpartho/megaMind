<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">MEGAMIND</title>
  <desc id="d">Animated banner: MEGAMIND, a bio-inspired continual learning UI agent</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b17"/>
      <stop offset="0.6" stop-color="#0f1730"/>
      <stop offset="1" stop-color="#1a1038"/>
    </linearGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#ff7b72"/>
      <animate attributeName="x1" values="0;0.5;0" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.5;1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
    <clipPath id="typeClip">
      <rect x="60" y="192" width="0" height="40">
        <animate attributeName="width" values="0;590;590;0" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .edge{stroke:#58a6ff;stroke-opacity:.38;stroke-width:1.2;stroke-dasharray:3 5;animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-8}}
    .node{animation:pulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes pulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.35)}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1000" cy="160" r="180" fill="#bc8cff" opacity="0.10">
      <animate attributeName="opacity" values="0.06;0.15;0.06" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="60" r="150" fill="#58a6ff" opacity="0.07">
      <animate attributeName="opacity" values="0.04;0.10;0.04" dur="8s" repeatCount="indefinite"/>
    </circle>
    <rect x="-200" y="0" width="200" height="320" fill="url(#sweep)">
      <animate attributeName="x" from="-200" to="1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- neural network (perception -> memory -> skills) -->
    <g>
      <line class="edge" x1="720" y1="90" x2="840" y2="60"/>
      <line class="edge" x1="720" y1="90" x2="840" y2="125"/>
      <line class="edge" x1="720" y1="160" x2="840" y2="125"/>
      <line class="edge" x1="720" y1="160" x2="840" y2="195"/>
      <line class="edge" x1="720" y1="230" x2="840" y2="195"/>
      <line class="edge" x1="720" y1="230" x2="840" y2="260"/>
      <line class="edge" x1="720" y1="160" x2="840" y2="260"/>
      <line class="edge" x1="840" y1="60" x2="960" y2="60"/>
      <line class="edge" x1="840" y1="60" x2="960" y2="125"/>
      <line class="edge" x1="840" y1="125" x2="960" y2="125"/>
      <line class="edge" x1="840" y1="125" x2="960" y2="195"/>
      <line class="edge" x1="840" y1="195" x2="960" y2="195"/>
      <line class="edge" x1="840" y1="195" x2="960" y2="260"/>
      <line class="edge" x1="840" y1="260" x2="960" y2="260"/>
      <line class="edge" x1="840" y1="125" x2="960" y2="60"/>
      <line class="edge" x1="840" y1="195" x2="960" y2="125"/>
      <line class="edge" x1="840" y1="260" x2="960" y2="195"/>
      <line class="edge" x1="960" y1="60" x2="1080" y2="100"/>
      <line class="edge" x1="960" y1="125" x2="1080" y2="100"/>
      <line class="edge" x1="960" y1="125" x2="1080" y2="160"/>
      <line class="edge" x1="960" y1="195" x2="1080" y2="160"/>
      <line class="edge" x1="960" y1="195" x2="1080" y2="220"/>
      <line class="edge" x1="960" y1="260" x2="1080" y2="220"/>
      <line class="edge" x1="960" y1="60" x2="1080" y2="160"/>
    </g>
    <g>
      <circle class="node" cx="720" cy="90" r="7" fill="#58a6ff"/>
      <circle class="node" cx="720" cy="160" r="7" fill="#58a6ff" style="animation-delay:.3s"/>
      <circle class="node" cx="720" cy="230" r="7" fill="#58a6ff" style="animation-delay:.6s"/>
      <circle class="node" cx="840" cy="60" r="7" fill="#bc8cff" style="animation-delay:.9s"/>
      <circle class="node" cx="840" cy="125" r="7" fill="#bc8cff" style="animation-delay:1.2s"/>
      <circle class="node" cx="840" cy="195" r="7" fill="#bc8cff" style="animation-delay:1.5s"/>
      <circle class="node" cx="840" cy="260" r="7" fill="#bc8cff" style="animation-delay:1.8s"/>
      <circle class="node" cx="960" cy="60" r="7" fill="#f0883e" style="animation-delay:.2s"/>
      <circle class="node" cx="960" cy="125" r="7" fill="#f0883e" style="animation-delay:.5s"/>
      <circle class="node" cx="960" cy="195" r="7" fill="#f0883e" style="animation-delay:.8s"/>
      <circle class="node" cx="960" cy="260" r="7" fill="#f0883e" style="animation-delay:1.1s"/>
      <circle class="node" cx="1080" cy="100" r="7" fill="#3fb950" style="animation-delay:1.4s"/>
      <circle class="node" cx="1080" cy="160" r="7" fill="#3fb950" style="animation-delay:1.7s"/>
      <circle class="node" cx="1080" cy="220" r="7" fill="#3fb950" style="animation-delay:2s"/>
    </g>

    <!-- status pill -->
    <rect x="60" y="50" width="345" height="28" rx="14" fill="#58a6ff" fill-opacity="0.12" stroke="#58a6ff" stroke-opacity="0.5"/>
    <circle class="blink" cx="78" cy="64" r="4" fill="#58a6ff"/>
    <text x="92" y="69" font-size="12" font-weight="700" fill="#58a6ff" letter-spacing="1.2">PHASE 1 · MODEL TRAINING IN PROGRESS</text>

    <!-- title -->
    <text x="58" y="165" font-size="88" font-weight="800" letter-spacing="3" fill="url(#ttl)" filter="url(#glow)">MEGAMIND</text>

    <!-- typed tagline -->
    <g clip-path="url(#typeClip)">
      <text x="60" y="218" font-size="25" fill="#c9d1d9">Bio-Inspired Continual Learning UI Agent</text>
    </g>
    <rect y="196" width="3" height="28" fill="#58a6ff">
      <animate attributeName="x" values="60;650;650;60" keyTimes="0;0.45;0.92;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- pills -->
    <rect x="60" y="252" width="160" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
    <text x="140" y="273" font-size="13" fill="#c9d1d9" text-anchor="middle">Imitation Learning</text>
    <rect x="232" y="252" width="170" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
    <text x="317" y="273" font-size="13" fill="#c9d1d9" text-anchor="middle">Tree-Graph Memory</text>
    <rect x="414" y="252" width="178" height="32" rx="16" fill="#161b22" stroke="#30363d"/>
    <text x="503" y="273" font-size="13" fill="#c9d1d9" text-anchor="middle">Selective Forgetting</text>
  </g>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#30363d"/>
</svg>
