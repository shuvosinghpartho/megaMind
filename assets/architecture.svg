<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="ti de">
  <title id="ti">MEGAMIND system architecture</title>
  <desc id="de">Animated diagram: screen recordings flow through a lightweight image encoder into short-term memory, pass a growth-check gate, and are promoted to long-term memory made of Big Trees and Small Trees connected by graph edges. A garbage collector prunes orphaned skills and decayed edges.</desc>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fb950"/></marker>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#ff7b72"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#f0883e"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#bc8cff"/></marker>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="encClip"><rect x="300" y="200" width="600" height="80" rx="14"/></clipPath>
  </defs>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .h{font-size:15px;font-weight:700;fill:#e6edf3}
    .s{font-size:12px;fill:#8b949e}
    .t{font-size:13px;fill:#e6edf3}
    .flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .pulse{animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    .blink{animation:blink 1.2s steps(2,start) infinite}
    @keyframes blink{to{visibility:hidden}}
    .tok{animation:slide 4.5s linear infinite}
    @keyframes slide{0%{transform:translateX(0);opacity:0}8%{opacity:1}88%{opacity:1}100%{transform:translateX(280px);opacity:0}}
    .fall{animation:fall 3.2s ease-in infinite}
    @keyframes fall{0%{transform:translateY(0);opacity:0}10%{opacity:1}70%{opacity:1}100%{transform:translateY(55px);opacity:0}}
  </style>

  <rect x="0.5" y="0.5" width="1199" height="999" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="38" class="h" font-size="18">SYSTEM ARCHITECTURE</text>
  <text x="40" y="58" class="s">Tree-Graph Hybrid · Memory-Augmented Continual Learning</text>

  <!-- legend -->
  <line x1="900" y1="40" x2="936" y2="40" stroke="#58a6ff" stroke-width="2" class="flow"/>
  <text x="946" y="44" class="s">Data flow</text>
  <line x1="900" y1="60" x2="936" y2="60" stroke="#f0883e" stroke-width="2" class="flow"/>
  <text x="946" y="64" class="s">Graph edge (relation)</text>
  <line x1="900" y1="80" x2="936" y2="80" stroke="#ff7b72" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="946" y="84" class="s">Prune / decay</text>

  <!-- input -->
  <rect x="470" y="62" width="260" height="44" rx="10" fill="#161b22" stroke="#8b949e"/>
  <circle class="blink" cx="490" cy="84" r="5" fill="#ff7b72"/>
  <text x="604" y="89" class="t" text-anchor="middle">Screen Recording / Live Screen</text>
  <path d="M600 106 V198" stroke="#58a6ff" stroke-width="2" fill="none" class="flow" marker-end="url(#ab)"/>
  <circle r="3.5" fill="#58a6ff"><animateMotion dur="1.6s" repeatCount="indefinite" path="M600 106 V198"/></circle>

  <!-- parent tree container -->
  <rect x="30" y="130" width="1140" height="838" rx="22" fill="none" stroke="#bc8cff" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="8 6"/>
  <text x="56" y="160" class="h" fill="#bc8cff" style="fill:#bc8cff">PARENT TREE (ROOT)</text>
  <text x="56" y="180" class="s">System base knowledge · starts minimal, grows dynamically</text>

  <!-- encoder -->
  <rect x="300" y="200" width="600" height="80" rx="14" fill="#0f1b2e" stroke="#58a6ff" stroke-width="1.5"/>
  <g clip-path="url(#encClip)">
    <rect x="240" y="200" width="90" height="80" fill="url(#scan)">
      <animate attributeName="x" values="240;900;240" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect class="pulse" x="322" y="228" width="64" height="26" rx="4" fill="none" stroke="#3fb950" stroke-dasharray="4 3"/>
  <text x="354" y="245" class="s" text-anchor="middle" style="fill:#3fb950">button</text>
  <rect class="pulse" x="814" y="228" width="64" height="26" rx="4" fill="none" stroke="#3fb950" stroke-dasharray="4 3" style="animation-delay:1.2s"/>
  <text x="846" y="245" class="s" text-anchor="middle" style="fill:#3fb950">icon</text>
  <text x="600" y="235" class="h" text-anchor="middle">Lightweight Image Encoder (Attention Mechanism)</text>
  <text x="600" y="257" class="s" text-anchor="middle">Detects task-relevant UI features: buttons, icons</text>

  <!-- encoder -> STM -->
  <path d="M400 280 V306 H270 V333" stroke="#58a6ff" stroke-width="2" fill="none" class="flow" marker-end="url(#ab)"/>
  <circle r="3.5" fill="#58a6ff"><animateMotion dur="1.8s" repeatCount="indefinite" path="M400 280 V306 H270 V333"/></circle>

  <!-- STM -->
  <rect x="60" y="335" width="420" height="170" rx="16" fill="#0d1b2e" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="84" y="364" class="h" style="fill:#58a6ff">SHORT-TERM MEMORY (STM)</text>
  <text x="84" y="382" class="s">Unconfirmed observation · temporary</text>
  <rect x="84" y="396" width="372" height="92" rx="10" fill="#0a1422" stroke="#58a6ff" stroke-opacity="0.5" stroke-dasharray="5 4"/>
  <circle class="blink" cx="100" cy="415" r="4.5" fill="#ff7b72"/>
  <text x="112" y="419" class="t">Temp Task: Video Record</text>
  <text x="112" y="436" class="s">(Observing user actions)</text>
  <g class="tok"><rect x="100" y="454" width="56" height="22" rx="7" fill="#12261a" stroke="#3fb950"/><text x="128" y="469" class="s" text-anchor="middle" style="fill:#3fb950">click</text></g>
  <g class="tok" style="animation-delay:-1.5s"><rect x="100" y="454" width="56" height="22" rx="7" fill="#12261a" stroke="#3fb950"/><text x="128" y="469" class="s" text-anchor="middle" style="fill:#3fb950">type</text></g>
  <g class="tok" style="animation-delay:-3s"><rect x="100" y="454" width="56" height="22" rx="7" fill="#12261a" stroke="#3fb950"/><text x="128" y="469" class="s" text-anchor="middle" style="fill:#3fb950">click</text></g>

  <!-- STM -> gate -->
  <path d="M480 420 H518" stroke="#58a6ff" stroke-width="2" fill="none" class="flow" marker-end="url(#ab)"/>

  <!-- growth gate -->
  <rect class="pulse" x="514" y="369" width="172" height="102" rx="18" fill="#d29922" fill-opacity="0.12"/>
  <rect x="520" y="375" width="160" height="90" rx="14" fill="#1b1708" stroke="#d29922" stroke-width="2"/>
  <text x="600" y="406" class="h" text-anchor="middle" style="fill:#d29922">GROWTH-CHECK</text>
  <text x="600" y="425" class="h" text-anchor="middle" style="fill:#d29922">GATE</text>
  <text x="600" y="448" class="s" text-anchor="middle">cohesive + repeated?</text>

  <!-- gate -> discard -->
  <path d="M680 420 H718" stroke="#ff7b72" stroke-width="2" fill="none" class="flow" marker-end="url(#ar)"/>
  <text x="699" y="410" class="s" text-anchor="middle" style="fill:#ff7b72;font-weight:700">No</text>

  <!-- discard bin -->
  <rect x="720" y="335" width="420" height="170" rx="16" fill="#241012" stroke="#ff7b72" stroke-opacity="0.8" stroke-width="1.5"/>
  <text x="744" y="364" class="h" style="fill:#ff7b72">DISCARDED / KEEP OBSERVING</text>
  <text x="744" y="382" class="s">noise · one-off actions · accidental clicks</text>
  <g class="fall"><rect x="760" y="402" width="70" height="22" rx="7" fill="#1c2128" stroke="#8b949e"/><text x="795" y="417" class="s" text-anchor="middle">misclick</text></g>
  <g class="fall" style="animation-delay:-.8s"><rect x="850" y="402" width="70" height="22" rx="7" fill="#1c2128" stroke="#8b949e"/><text x="885" y="417" class="s" text-anchor="middle">idle</text></g>
  <g class="fall" style="animation-delay:-1.6s"><rect x="940" y="402" width="70" height="22" rx="7" fill="#1c2128" stroke="#8b949e"/><text x="975" y="417" class="s" text-anchor="middle">hover</text></g>
  <g class="fall" style="animation-delay:-2.4s"><rect x="1030" y="402" width="70" height="22" rx="7" fill="#1c2128" stroke="#8b949e"/><text x="1065" y="417" class="s" text-anchor="middle">noise</text></g>

  <!-- gate -> LTM -->
  <path d="M600 465 V563" stroke="#3fb950" stroke-width="2.5" fill="none" class="flow" marker-end="url(#ag)"/>
  <circle r="4" fill="#3fb950"><animateMotion dur="1.8s" repeatCount="indefinite" path="M600 465 V563"/></circle>
  <text x="614" y="520" class="s" style="fill:#3fb950;font-weight:700">Yes · promote</text>

  <!-- LTM -->
  <rect x="60" y="565" width="1080" height="260" rx="16" fill="#0c1a12" stroke="#3fb950" stroke-width="1.5"/>
  <text x="84" y="594" class="h" style="fill:#3fb950">LONG-TERM MEMORY (LTM)</text>
  <text x="84" y="612" class="s">Permanent &amp; reusable skills · Tree-Graph Hybrid</text>
  <text x="100" y="646" class="s" style="font-weight:700;letter-spacing:1px">BIG TREES</text>
  <text x="188" y="646" class="s">compound tasks</text>
  <text x="830" y="646" class="s" style="font-weight:700;letter-spacing:1px">SMALL TREES</text>
  <text x="946" y="646" class="s">atomic skills</text>
  <text x="595" y="646" class="s" text-anchor="middle">graph edges · sequence &amp; relations</text>

  <!-- graph edges: Big1 (orange) -->
  <path d="M360 683 C560 683 630 669 830 669" stroke="#f0883e" stroke-width="2" fill="none" class="flow" marker-end="url(#ao)"/>
  <path d="M360 691 C560 691 630 711 830 711" stroke="#f0883e" stroke-width="2" fill="none" class="flow" marker-end="url(#ao)"/>
  <path d="M360 699 C560 699 630 753 830 753" stroke="#f0883e" stroke-width="2" fill="none" class="flow" marker-end="url(#ao)"/>
  <!-- graph edges: Big2 (purple) -->
  <path d="M360 758 C560 758 630 669 830 669" stroke="#bc8cff" stroke-width="2" fill="none" class="flow" marker-end="url(#ap)" style="animation-delay:-.4s"/>
  <path d="M360 774 C560 774 630 753 830 753" stroke="#bc8cff" stroke-width="2" fill="none" class="flow" marker-end="url(#ap)" style="animation-delay:-.4s"/>
  <!-- decayed edge -->
  <path d="M360 782 C560 782 700 795 830 795" stroke="#ff7b72" stroke-width="1.5" fill="none" stroke-dasharray="3 5" class="pulse"/>

  <!-- big trees -->
  <rect x="100" y="665" width="260" height="52" rx="10" fill="#2a1a0c" stroke="#f0883e" stroke-width="1.5"/>
  <text x="116" y="687" class="h" style="fill:#f0883e">Big Tree 1: FB Post</text>
  <text x="116" y="705" class="s">Context: Web</text>
  <rect x="100" y="740" width="260" height="52" rx="10" fill="#1d1535" stroke="#bc8cff" stroke-width="1.5"/>
  <text x="116" y="762" class="h" style="fill:#bc8cff">Big Tree 2: Insta Post</text>
  <text x="116" y="780" class="s">Context: App</text>

  <!-- small trees -->
  <rect x="830" y="652" width="270" height="34" rx="8" fill="#0f2418" stroke="#3fb950" stroke-width="1.5"/>
  <text x="846" y="674" class="t">A · Login</text>
  <rect x="1032" y="659" width="56" height="20" rx="10" fill="#3fb950" fill-opacity="0.2"/>
  <text x="1060" y="673" class="s" text-anchor="middle" style="fill:#3fb950;font-weight:700">ref 2</text>

  <rect x="830" y="694" width="270" height="34" rx="8" fill="#0f2418" stroke="#39d0d0" stroke-width="1.5"/>
  <text x="846" y="716" class="t">B · Click</text>
  <rect x="1032" y="701" width="56" height="20" rx="10" fill="#39d0d0" fill-opacity="0.2"/>
  <text x="1060" y="715" class="s" text-anchor="middle" style="fill:#39d0d0;font-weight:700">ref 1</text>

  <rect x="830" y="736" width="270" height="34" rx="8" fill="#0f2418" stroke="#3fb950" stroke-width="1.5"/>
  <text x="846" y="758" class="t">C · Type Text</text>
  <rect x="1032" y="743" width="56" height="20" rx="10" fill="#3fb950" fill-opacity="0.2"/>
  <text x="1060" y="757" class="s" text-anchor="middle" style="fill:#3fb950;font-weight:700">ref 2</text>

  <g class="pulse">
    <rect x="830" y="778" width="270" height="34" rx="8" fill="#241012" stroke="#ff7b72" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="846" y="800" class="t" style="fill:#ff7b72">D · Scroll</text>
    <rect x="1032" y="785" width="56" height="20" rx="10" fill="#ff7b72" fill-opacity="0.2"/>
    <text x="1060" y="799" class="s" text-anchor="middle" style="fill:#ff7b72;font-weight:700">ref 0</text>
  </g>

  <!-- garbage collection -->
  <path d="M1000 868 V828" stroke="#ff7b72" stroke-width="2" fill="none" stroke-dasharray="4 4" class="flow" marker-end="url(#ar)" style="animation-direction:normal"/>
  <text x="1012" y="852" class="s" style="fill:#ff7b72">prune</text>
  <rect x="60" y="868" width="1080" height="84" rx="14" fill="#1c0f11" stroke="#ff7b72" stroke-width="1.5"/>
  <text x="84" y="896" class="h" style="fill:#ff7b72">FORGETTING &amp; PRUNING MECHANISM (Garbage Collection)</text>
  <text x="84" y="921" class="t"><tspan style="font-weight:700">Reference Counting</tspan> · deletes orphaned Small Trees (count = 0)</text>
  <text x="620" y="921" class="t"><tspan style="font-weight:700">Time-based Decay</tspan> · weakens unused graph edges</text>
  <text x="84" y="940" class="s">Keeps the agent lightweight enough for edge devices</text>
</svg>
