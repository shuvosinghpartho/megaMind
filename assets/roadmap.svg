<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="ti de">
  <title id="ti">MEGAMIND roadmap</title>
  <desc id="de">Animated roadmap timeline with three phases and eight steps. Steps 1 and 2 are done, step 3 model training is in progress, steps 4 to 8 are planned.</desc>
  <style>
    text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif}
    .h{font-size:15px;font-weight:700;fill:#e6edf3}
    .s{font-size:11.5px;fill:#8b949e}
    .l{font-size:13px;font-weight:700;fill:#e6edf3}
    .ph{font-size:11px;font-weight:800;fill:#0d1117;letter-spacing:.8px}
    .num{font-size:14px;font-weight:700;fill:#8b949e}
    .flow{stroke-dasharray:6 6;animation:flow 1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .ring{animation:ring 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes ring{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.7);opacity:0}}
    .spin{animation:spin 4s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes spin{to{transform:rotate(360deg)}}
    .bob{animation:bob 1.6s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .pulse{animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
  </style>

  <rect x="0.5" y="0.5" width="1199" height="369" rx="16" fill="#0d1117" stroke="#30363d"/>
  <text x="40" y="34" class="h" font-size="18">PROJECT ROADMAP</text>

  <!-- phase bands -->
  <rect x="70" y="56" width="360" height="30" rx="15" fill="#58a6ff"/>
  <text x="250" y="76" class="ph" text-anchor="middle">PHASE 1 · BASE KNOWLEDGE</text>
  <rect x="490" y="56" width="220" height="30" rx="15" fill="#bc8cff"/>
  <text x="600" y="76" class="ph" text-anchor="middle">PHASE 2 · MEMORY</text>
  <rect x="770" y="56" width="360" height="30" rx="15" fill="#f0883e"/>
  <text x="950" y="76" class="ph" text-anchor="middle">PHASE 3 · INTEGRATION</text>

  <!-- track -->
  <line x1="110" y1="200" x2="1090" y2="200" stroke="#30363d" stroke-width="6" stroke-linecap="round"/>
  <line x1="110" y1="200" x2="250" y2="200" stroke="#3fb950" stroke-width="6" stroke-linecap="round"/>
  <line x1="250" y1="200" x2="390" y2="200" stroke="#58a6ff" stroke-width="6" class="flow"/>

  <!-- nodes: done -->
  <circle cx="110" cy="200" r="20" fill="#3fb950"/>
  <path d="M100 200 l7 7 l13 -14" stroke="#0d1117" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="250" cy="200" r="20" fill="#3fb950"/>
  <path d="M240 200 l7 7 l13 -14" stroke="#0d1117" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- node: in progress -->
  <circle class="ring" cx="390" cy="200" r="22" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <circle class="spin" cx="390" cy="200" r="28" fill="none" stroke="#58a6ff" stroke-width="2" stroke-dasharray="6 7"/>
  <circle cx="390" cy="200" r="20" fill="#0d1117" stroke="#58a6ff" stroke-width="4"/>
  <text x="390" y="206" class="num" text-anchor="middle" style="fill:#58a6ff">3</text>

  <!-- nodes: planned -->
  <circle cx="530" cy="200" r="18" fill="#161b22" stroke="#484f58" stroke-width="2.5"/><text x="530" y="206" class="num" text-anchor="middle">4</text>
  <circle cx="670" cy="200" r="18" fill="#161b22" stroke="#484f58" stroke-width="2.5"/><text x="670" y="206" class="num" text-anchor="middle">5</text>
  <circle cx="810" cy="200" r="18" fill="#161b22" stroke="#484f58" stroke-width="2.5"/><text x="810" y="206" class="num" text-anchor="middle">6</text>
  <circle cx="950" cy="200" r="18" fill="#161b22" stroke="#484f58" stroke-width="2.5"/><text x="950" y="206" class="num" text-anchor="middle">7</text>
  <circle cx="1090" cy="200" r="18" fill="#161b22" stroke="#484f58" stroke-width="2.5"/><text x="1090" y="206" class="num" text-anchor="middle">8</text>

  <!-- we are here -->
  <g class="bob">
    <rect x="334" y="116" width="112" height="26" rx="13" fill="#58a6ff"/>
    <path d="M382 142 L390 152 L398 142 Z" fill="#58a6ff"/>
    <text x="390" y="133" text-anchor="middle" style="font-size:11px;font-weight:800;fill:#0d1117;letter-spacing:.6px">WE ARE HERE</text>
  </g>

  <!-- labels -->
  <g text-anchor="middle">
    <text x="110" y="248" class="l">Data</text><text x="110" y="266" class="l">Collection</text><text x="110" y="285" class="s">100–200 screenshots</text>
    <text x="250" y="248" class="l">Preprocessing</text><text x="250" y="266" class="l">&amp; Annotation</text><text x="250" y="285" class="s">Roboflow · YOLO format</text>
    <text x="390" y="248" class="l">Model</text><text x="390" y="266" class="l">Training</text><text x="390" y="285" class="s">YOLOv8n encoder</text>
    <text x="530" y="248" class="l">STM &amp; LTM</text><text x="530" y="266" class="l">Setup</text><text x="530" y="285" class="s">Parent Tree branches</text>
    <text x="670" y="248" class="l">Growth-Check</text><text x="670" y="266" class="l">Mechanism</text><text x="670" y="285" class="s">Filter noise, promote</text>
    <text x="810" y="248" class="l">Big / Small</text><text x="810" y="266" class="l">Tree Logic</text><text x="810" y="285" class="s">Directed graph edges</text>
    <text x="950" y="248" class="l">Garbage</text><text x="950" y="266" class="l">Collection</text><text x="950" y="285" class="s">Ref count + decay</text>
    <text x="1090" y="248" class="l">Final Agent</text><text x="1090" y="266" class="l">Integration</text><text x="1090" y="285" class="s">Watch · extract · act</text>
  </g>

  <!-- status chips -->
  <g text-anchor="middle" style="font-size:10px;font-weight:800;letter-spacing:.6px">
    <rect x="75" y="298" width="70" height="20" rx="10" fill="#3fb950" fill-opacity=".2"/><text x="110" y="312" fill="#3fb950">DONE</text>
    <rect x="215" y="298" width="70" height="20" rx="10" fill="#3fb950" fill-opacity=".2"/><text x="250" y="312" fill="#3fb950">DONE</text>
    <g class="pulse"><rect x="342" y="298" width="96" height="20" rx="10" fill="#58a6ff" fill-opacity=".25"/><text x="390" y="312" fill="#58a6ff">IN PROGRESS</text></g>
    <rect x="495" y="298" width="70" height="20" rx="10" fill="#8b949e" fill-opacity=".15"/><text x="530" y="312" fill="#8b949e">PLANNED</text>
    <rect x="635" y="298" width="70" height="20" rx="10" fill="#8b949e" fill-opacity=".15"/><text x="670" y="312" fill="#8b949e">PLANNED</text>
    <rect x="775" y="298" width="70" height="20" rx="10" fill="#8b949e" fill-opacity=".15"/><text x="810" y="312" fill="#8b949e">PLANNED</text>
    <rect x="915" y="298" width="70" height="20" rx="10" fill="#8b949e" fill-opacity=".15"/><text x="950" y="312" fill="#8b949e">PLANNED</text>
    <rect x="1055" y="298" width="70" height="20" rx="10" fill="#8b949e" fill-opacity=".15"/><text x="1090" y="312" fill="#8b949e">PLANNED</text>
  </g>

  <text x="600" y="348" class="s" text-anchor="middle">2 of 8 steps complete · Step 3 (model training) in progress</text>
</svg>
